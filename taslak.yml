name: Karar taslağı üret (isteğe bağlı)

# ham/ klasörüne .txt karar metni yüklediğinizde çalışır
on:
  push:
    paths: ["ham/*.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  taslak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python taslak_olustur.py
      - run: |
          git config user.name "paylasim-botu"
          git config user.email "paylasim-botu@users.noreply.github.com"
          git add -A kararlar ham
          git diff --cached --quiet || git commit -m "Yeni karar taslakları"
          git push
